name: Copilot PR Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [master, dev]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-copilot-review:
    name: Request Copilot review
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Request GitHub Copilot as PR reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set +e
          gh pr edit "$PR_URL" --add-reviewer @copilot
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::notice title=Copilot review not requested::GitHub Copilot review may be unavailable for this repository, plan, or ruleset. Enable Copilot code review in repository settings or request it manually from the PR reviewer menu."
          fi
          exit 0
