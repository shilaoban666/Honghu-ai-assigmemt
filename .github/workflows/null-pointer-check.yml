name: Null Pointer Check

on:
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  null-pointer-check:
    name: SpotBugs Null Pointer Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compile project
        run: mvn compile -DskipTests -q

      - name: Run SpotBugs null pointer check
        run: mvn spotbugs:check -q

      - name: Upload SpotBugs report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-null-pointer-report
          path: target/spotbugs*.xml
          if-no-files-found: ignore
