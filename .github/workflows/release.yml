name: Release

# 打 tag（如 v1.2.0）即出版本：构建 jar、构建并推送 Docker 镜像到 GHCR、创建 GitHub Release。
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送镜像到 GHCR

jobs:
  release:
    name: Build · Image · Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jar (run unit tests)
        run: mvn -B -ntp -Pci clean package

      # GHCR 镜像名必须全小写，这里把 owner/repo 统一转小写。
      - name: Resolve lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest

      - name: Create GitHub Release (attach jar)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: target/*.jar
