# ============================================================
# Honghu AI — full local stack
#
#   docker compose up -d --build
#
# Brings up: PostgreSQL, Redis, and a Milvus standalone cluster
# (etcd + MinIO + Milvus), then the Spring Boot app itself.
# The app waits for every datastore to report healthy before it starts.
#
# Set your AI provider key(s) in .env first (see .env.example).
# ============================================================
name: honghu-ai

services:
  # ---------------------- PostgreSQL ----------------------
  postgres:
    image: postgres:16-alpine
    container_name: honghu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------- Redis ----------------------
  redis:
    image: redis:7-alpine
    container_name: honghu-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-12345}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-12345}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------- Milvus deps: etcd ----------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: honghu-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcddata:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------- Milvus deps: MinIO ----------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: honghu-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - miniodata:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------- Milvus standalone ----------------------
  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: honghu-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvusdata:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 90s

  # ---------------------- Honghu AI application ----------------------
  app:
    build: .
    image: honghu-ai:latest
    container_name: honghu-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    environment:
      # --- datastores (point at the compose services) ---
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-postgres}
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-12345}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-12345}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      # --- one-command boot: keep AWS-dependent paths off ---
      AWS_S3_ENABLED: ${AWS_S3_ENABLED:-false}
      AWS_SQS_ENABLED: ${AWS_SQS_ENABLED:-false}
      APP_RAG_LISTENER_ENABLED: ${APP_RAG_LISTENER_ENABLED:-false}
      # --- 模型 API Key 加密主密钥（后台「Provider 注册表」用它做 AES-GCM 加密）---
      # 开发环境留空即可：SecretCipher 会用确定性的开发兜底密钥（仅限本地/demo，勿用于生产）。
      APP_SKILL_SECRET_KEY: ${APP_SKILL_SECRET_KEY:-}
      # --- AI providers（也可改为在后台 Provider 注册表里加密保存，不必填这里）---
      DEEPSEEK_CLOUD_API_KEY: ${DEEPSEEK_CLOUD_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ALIYUN_API_KEY: ${ALIYUN_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_LOCAL_BASE_URL: ${OLLAMA_LOCAL_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  pgdata:
  redisdata:
  etcddata:
  miniodata:
  milvusdata:
