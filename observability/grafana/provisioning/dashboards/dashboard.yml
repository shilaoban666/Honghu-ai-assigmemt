# Grafana 看板自动装配（P0-2）：从 /var/lib/grafana/dashboards 加载 JSON
apiVersion: 1
providers:
  - name: "Honghu AI"
    orgId: 1
    folder: "Honghu AI"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
