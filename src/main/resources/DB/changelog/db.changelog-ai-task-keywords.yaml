databaseChangeLog:
  # 保留原 XML logicalFilePath，确保 Liquibase 将这份 YAML 继续识别为历史那套变更集。
  - logicalFilePath: "DB/changelog/db.changelog-ai-task-keywords.xml"
  - changeSet:
      id: "4"
      author: "shilaoban"
      comment: "创建 AI 任务路由关键词表，并初始化任务分类关键词"
      changes:
        - createTable:
            tableName: "ai_task_keyword"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "task_type"
                  type: "VARCHAR(32)"
                  constraints:
                    nullable: false
              - column:
                  name: "keyword"
                  type: "VARCHAR(128)"
                  constraints:
                    nullable: false
              - column:
                  name: "enabled"
                  type: "BOOLEAN"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: "priority"
                  type: "INT"
                  defaultValueNumeric: 100
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: "ai_task_keyword"
            columnNames: "task_type, keyword"
            constraintName: "uk_ai_task_keyword_type_keyword"
        - createIndex:
            indexName: "idx_ai_task_keyword_enabled_priority"
            tableName: "ai_task_keyword"
            columns:
              - column:
                  name: "enabled"
              - column:
                  name: "priority"
        - createIndex:
            indexName: "idx_ai_task_keyword_type"
            tableName: "ai_task_keyword"
            columns:
              - column:
                  name: "task_type"
        - insert:
            tableName: "ai_task_keyword"
            columns:
              - column:
                  name: "task_type"
                  value: "CODE"
              - column:
                  name: "keyword"
                  value: "代码"
              - column:
                  name: "priority"
