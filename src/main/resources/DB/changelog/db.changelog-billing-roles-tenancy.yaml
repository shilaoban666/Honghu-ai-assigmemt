databaseChangeLog:
  # 这一组 changeSet 一次性引入“计费 + 角色默认模型 + 企业套餐 + workspace 多租户”四套能力。
  # 之所以放在同一个 changelog，是因为它们之间存在明确的先后依赖：
  # 1. 先建价格表和用量流水表，才能记录 AI 成本；
  # 2. 再建角色/套餐/workspace 相关表，才能表达“谁在什么空间里能用哪些模型”；
  # 3. 最后插入初始化数据和兼容性索引，让新旧数据都能平滑过渡。
  - changeSet:
      id: "billing-roles-tenancy-1"
      author: "codex"
      # 建立“模型价格快照表”，为后续按时间点计费提供事实基础。
      changes:
        - createTable:
            tableName: "ai_model_pricing"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "model_code"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "currency"
                  type: "VARCHAR(8)"
                  defaultValue: "CNY"
                  constraints:
                    nullable: false
              - column:
                  name: "prompt_price_per_million"
                  type: "DECIMAL(18,6)"
                  constraints:
                    nullable: false
              - column:
                  name: "completion_price_per_million"
                  type: "DECIMAL(18,6)"
                  constraints:
                    nullable: false
              - column:
                  name: "cached_input_price_per_million"
                  type: "DECIMAL(18,6)"
              - column:
                  name: "request_surcharge"
                  type: "DECIMAL(18,6)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "markup_ratio"
                  type: "DECIMAL(6,4)"
                  defaultValueNumeric: 1.0000
                  constraints:
                    nullable: false
              - column:
                  name: "effective_from"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "effective_to"
                  type: "TIMESTAMP"
              - column:
                  name: "enabled"
                  type: "BOOLEAN"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "ai_model_pricing"
            baseColumnNames: "model_code"
            referencedTableName: "ai_model_definition"
            referencedColumnNames: "model_code"
            constraintName: "fk_ai_model_pricing_model"
        - createIndex:
            indexName: "idx_ai_model_pricing_model_active"
            tableName: "ai_model_pricing"
            columns:
              - column:
                  name: "model_code"
              - column:
                  name: "enabled"
              - column:
                  name: "effective_from"
        - addUniqueConstraint:
            tableName: "ai_model_pricing"
            columnNames: "model_code,currency,effective_from"
            constraintName: "uk_ai_model_pricing_model_currency_from"
  - changeSet:
      id: "billing-roles-tenancy-2"
      author: "codex"
      # 建立“AI 用量流水表”，以后所有配额、账单、报表都从这里聚合。
      changes:
        - createTable:
            tableName: "ai_usage_event"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "request_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "attempt_no"
                  type: "INT"
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: "user_id"
                  type: "VARCHAR(64)"
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
              - column:
                  name: "session_id"
                  type: "VARCHAR(64)"
              - column:
                  name: "chat_id"
                  type: "BIGINT"
              - column:
                  name: "model_code"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "effective_model_code"
                  type: "VARCHAR(100)"
              - column:
                  name: "provider_code"
                  type: "VARCHAR(64)"
              - column:
                  name: "prompt_tokens"
                  type: "INT"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "completion_tokens"
                  type: "INT"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "cached_prompt_tokens"
                  type: "INT"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "total_tokens"
                  type: "INT"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "pricing_id"
                  type: "BIGINT"
              - column:
                  name: "cost_vendor"
                  type: "DECIMAL(20,8)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "cost_billed"
                  type: "DECIMAL(20,8)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "currency"
                  type: "VARCHAR(8)"
                  defaultValue: "CNY"
                  constraints:
                    nullable: false
              - column:
                  name: "latency_ms"
                  type: "BIGINT"
              - column:
                  name: "status"
                  type: "VARCHAR(32)"
                  constraints:
                    nullable: false
              - column:
                  name: "error_message"
                  type: "VARCHAR(1000)"
              - column:
                  name: "raw_usage_json"
                  type: "TEXT"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "ai_usage_event"
            baseColumnNames: "model_code"
            referencedTableName: "ai_model_definition"
            referencedColumnNames: "model_code"
            constraintName: "fk_ai_usage_event_model"
        - addForeignKeyConstraint:
            baseTableName: "ai_usage_event"
            baseColumnNames: "pricing_id"
            referencedTableName: "ai_model_pricing"
            referencedColumnNames: "id"
            constraintName: "fk_ai_usage_event_pricing"
        - addUniqueConstraint:
            tableName: "ai_usage_event"
            columnNames: "request_id,attempt_no"
            constraintName: "uk_ai_usage_event_request_attempt"
        - createIndex:
            indexName: "idx_ai_usage_user_created"
            tableName: "ai_usage_event"
            columns:
              - column:
                  name: "user_id"
              - column:
                  name: "created_at"
        - createIndex:
            indexName: "idx_ai_usage_workspace_created"
            tableName: "ai_usage_event"
            columns:
              - column:
                  name: "workspace_id"
              - column:
                  name: "created_at"
        - createIndex:
            indexName: "idx_ai_usage_model_created"
            tableName: "ai_usage_event"
            columns:
              - column:
                  name: "model_code"
              - column:
                  name: "created_at"
  - changeSet:
      id: "billing-roles-tenancy-3"
      author: "codex"
      # 建立“个人角色额度 + 角色默认模型”两张基础权限表。
      changes:
        - createTable:
            tableName: "role_quota_config"
            columns:
              - column:
                  name: "role"
                  type: "VARCHAR(20)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "daily_limit"
                  type: "DECIMAL(18,4)"
              - column:
                  name: "monthly_limit"
                  type: "DECIMAL(18,4)"
              - column:
                  name: "concurrent_requests"
                  type: "INT"
              - column:
                  name: "description"
                  type: "VARCHAR(200)"
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - createTable:
            tableName: "role_model_default"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "role"
                  type: "VARCHAR(20)"
                  constraints:
                    nullable: false
              - column:
                  name: "model_code"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "enabled"
                  type: "BOOLEAN"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: "source"
                  type: "VARCHAR(64)"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "role_model_default"
            baseColumnNames: "model_code"
            referencedTableName: "ai_model_definition"
            referencedColumnNames: "model_code"
            constraintName: "fk_role_model_default_model"
        - addUniqueConstraint:
            tableName: "role_model_default"
            columnNames: "role,model_code"
            constraintName: "uk_role_model_default_role_model"
        - createIndex:
            indexName: "idx_role_model_default_role"
            tableName: "role_model_default"
            columns:
              - column:
                  name: "role"
  - changeSet:
      id: "billing-roles-tenancy-4"
      author: "codex"
      # 建立 organization / workspace / workspace_member / user_default_workspace，补齐多租户骨架。
      changes:
        - createTable:
            tableName: "organization"
            columns:
              - column:
                  name: "org_id"
                  type: "VARCHAR(64)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "name"
                  type: "VARCHAR(160)"
                  constraints:
                    nullable: false
              - column:
                  name: "status"
                  type: "VARCHAR(20)"
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - createTable:
            tableName: "plan"
            columns:
              - column:
                  name: "plan_code"
                  type: "VARCHAR(64)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "display_name"
                  type: "VARCHAR(160)"
                  constraints:
                    nullable: false
              - column:
                  name: "tier"
                  type: "INT"
              - column:
                  name: "description"
                  type: "VARCHAR(500)"
              - column:
                  name: "enabled"
                  type: "BOOLEAN"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - createTable:
            tableName: "workspace"
            columns:
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "org_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "name"
                  type: "VARCHAR(160)"
                  constraints:
                    nullable: false
              - column:
                  name: "plan_code"
                  type: "VARCHAR(64)"
              - column:
                  name: "status"
                  type: "VARCHAR(20)"
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "workspace"
            baseColumnNames: "org_id"
            referencedTableName: "organization"
            referencedColumnNames: "org_id"
            constraintName: "fk_workspace_org"
        - addForeignKeyConstraint:
            baseTableName: "workspace"
            baseColumnNames: "plan_code"
            referencedTableName: "plan"
            referencedColumnNames: "plan_code"
            constraintName: "fk_workspace_plan"
        - createTable:
            tableName: "workspace_member"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "user_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "member_role"
                  type: "VARCHAR(20)"
                  constraints:
                    nullable: false
              - column:
                  name: "status"
                  type: "VARCHAR(20)"
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "workspace_member"
            baseColumnNames: "workspace_id"
            referencedTableName: "workspace"
            referencedColumnNames: "workspace_id"
            constraintName: "fk_workspace_member_workspace"
        - addForeignKeyConstraint:
            baseTableName: "workspace_member"
            baseColumnNames: "user_id"
            referencedTableName: "users"
            referencedColumnNames: "user_id"
            constraintName: "fk_workspace_member_user"
        - addUniqueConstraint:
            tableName: "workspace_member"
            columnNames: "workspace_id,user_id"
            constraintName: "uk_workspace_member_workspace_user"
        - createTable:
            tableName: "user_default_workspace"
            columns:
              - column:
                  name: "user_id"
                  type: "VARCHAR(64)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "user_default_workspace"
            baseColumnNames: "user_id"
            referencedTableName: "users"
            referencedColumnNames: "user_id"
            constraintName: "fk_user_default_workspace_user"
        - addForeignKeyConstraint:
            baseTableName: "user_default_workspace"
            baseColumnNames: "workspace_id"
            referencedTableName: "workspace"
            referencedColumnNames: "workspace_id"
            constraintName: "fk_user_default_workspace_workspace"
  - changeSet:
      id: "billing-roles-tenancy-5"
      author: "codex"
      # 建立套餐权益和用户级覆盖表，把“基础规则 + 个别特批/禁用”都纳入结构化配置。
      changes:
        - createTable:
            tableName: "plan_entitlement"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "plan_code"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "entitlement_type"
                  type: "VARCHAR(32)"
                  constraints:
                    nullable: false
              - column:
                  name: "entitlement_key"
                  type: "VARCHAR(100)"
                  constraints:
                    nullable: false
              - column:
                  name: "value_text"
                  type: "VARCHAR(500)"
              - column:
                  name: "value_number"
                  type: "DECIMAL(18,4)"
              - column:
                  name: "enabled"
                  type: "BOOLEAN"
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
              - column:
                  name: "updated_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "plan_entitlement"
            baseColumnNames: "plan_code"
            referencedTableName: "plan"
            referencedColumnNames: "plan_code"
            constraintName: "fk_plan_entitlement_plan"
        - addUniqueConstraint:
            tableName: "plan_entitlement"
            columnNames: "plan_code,entitlement_type,entitlement_key"
            constraintName: "uk_plan_entitlement_plan_type_key"
        - createIndex:
            indexName: "idx_plan_entitlement_plan_type"
            tableName: "plan_entitlement"
            columns:
              - column:
                  name: "plan_code"
              - column:
                  name: "entitlement_type"
        - addColumn:
            tableName: "user_model_permission"
            columns:
              - column:
                  name: "override_type"
                  type: "VARCHAR(10)"
                  defaultValue: "GRANT"
                  constraints:
                    nullable: false
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
              - column:
                  name: "reason"
                  type: "VARCHAR(200)"
              - column:
                  name: "expires_at"
                  type: "TIMESTAMP"
        - addForeignKeyConstraint:
            baseTableName: "user_model_permission"
            baseColumnNames: "workspace_id"
            referencedTableName: "workspace"
            referencedColumnNames: "workspace_id"
            constraintName: "fk_user_model_permission_workspace"
        - createTable:
            tableName: "user_quota_override"
            columns:
              - column:
                  name: "id"
                  type: "BIGSERIAL"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: "user_id"
                  type: "VARCHAR(64)"
                  constraints:
                    nullable: false
              - column:
                  name: "workspace_id"
                  type: "VARCHAR(64)"
              - column:
                  name: "daily_delta"
                  type: "DECIMAL(18,4)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "monthly_delta"
                  type: "DECIMAL(18,4)"
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: "reason"
                  type: "VARCHAR(200)"
              - column:
                  name: "expires_at"
                  type: "TIMESTAMP"
              - column:
                  name: "created_at"
                  type: "TIMESTAMP"
                  defaultValueComputed: "CURRENT_TIMESTAMP"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: "user_quota_override"
            baseColumnNames: "user_id"
            referencedTableName: "users"
            referencedColumnNames: "user_id"
            constraintName: "fk_user_quota_override_user"
        - addForeignKeyConstraint:
            baseTableName: "user_quota_override"
            baseColumnNames: "workspace_id"
            referencedTableName: "workspace"
            referencedColumnNames: "workspace_id"
            constraintName: "fk_user_quota_override_workspace"
  - changeSet:
      id: "billing-roles-tenancy-6"
      author: "codex"
      # 初始化角色额度，让不同平台角色从第一天起就有默认预算。
      changes:
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "GUEST" }
              - column: { name: "daily_limit", valueNumeric: 0.50 }
              - column: { name: "monthly_limit", valueNumeric: 5.00 }
              - column: { name: "description", value: "试用" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "USER" }
              - column: { name: "daily_limit", valueNumeric: 2.00 }
              - column: { name: "monthly_limit", valueNumeric: 30.00 }
              - column: { name: "description", value: "免费档" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "PRO" }
              - column: { name: "daily_limit", valueNumeric: 10.00 }
              - column: { name: "monthly_limit", valueNumeric: 200.00 }
              - column: { name: "description", value: "订阅级 1" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "PLUS" }
              - column: { name: "daily_limit", valueNumeric: 30.00 }
              - column: { name: "monthly_limit", valueNumeric: 600.00 }
              - column: { name: "description", value: "订阅级 2" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "PRO_PLUS" }
              - column: { name: "daily_limit", valueNumeric: 100.00 }
              - column: { name: "monthly_limit", valueNumeric: 2000.00 }
              - column: { name: "description", value: "订阅级 3" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "VIP" }
              - column: { name: "description", value: "无限制" }
        - insert:
            tableName: "role_quota_config"
            columns:
              - column: { name: "role", value: "ADMIN" }
              - column: { name: "description", value: "无限制后台管理员" }
  - changeSet:
      id: "billing-roles-tenancy-7"
      author: "codex"
      # 初始化角色默认模型：高阶角色放开全部，基础角色只给较低层级模型。
      changes:
        - sql:
            sql: |
              insert into role_model_default(role, model_code, enabled, source)
              select r.role, m.model_code, true, 'migration'
              from (values ('VIP'),('ADMIN'),('PRO_PLUS')) as r(role)
              cross join ai_model_definition m
              where m.enabled = true
              on conflict (role, model_code) do nothing;
              insert into role_model_default(role, model_code, enabled, source)
              select r.role, m.model_code, true, 'migration'
              from (values ('GUEST'),('USER'),('PRO')) as r(role)
              cross join ai_model_definition m
              where m.enabled = true and m.level >= 2
              on conflict (role, model_code) do nothing;
              insert into role_model_default(role, model_code, enabled, source)
              select 'PLUS', m.model_code, true, 'migration'
              from ai_model_definition m
              where m.enabled = true and m.level <= 2
              on conflict (role, model_code) do nothing;
  - changeSet:
      id: "billing-roles-tenancy-8"
      author: "codex"
