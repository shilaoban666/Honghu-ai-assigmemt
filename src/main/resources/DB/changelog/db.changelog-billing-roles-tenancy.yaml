  - changeSet:
      id: "billing-roles-tenancy-9"
      author: "codex"
      # 把历史 users 数据补齐成“个人组织 + 个人 workspace + OWNER 成员 + 默认 workspace”。
      changes:
        - sql:
            sql: |
              insert into organization(org_id, name, status)
              select user_id, '个人组织-' || username, 'ACTIVE'
              from users
              on conflict (org_id) do nothing;
              insert into workspace(workspace_id, org_id, name, plan_code, status)
              select user_id, user_id, '个人空间', null, 'ACTIVE'
              from users
              on conflict (workspace_id) do nothing;
              insert into workspace_member(workspace_id, user_id, member_role, status)
              select user_id, user_id, 'OWNER', 'ACTIVE'
              from users
              on conflict (workspace_id, user_id) do nothing;
              insert into user_default_workspace(user_id, workspace_id)
              select user_id, user_id
              from users
              on conflict (user_id) do nothing;
