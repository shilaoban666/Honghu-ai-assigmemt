  - changeSet:
      id: "billing-roles-tenancy-11"
      author: "codex"
      # 调整 user_model_permission 唯一索引，把 workspace 维度纳入去重键，支持“同用户在不同空间不同授权”。
      changes:
        - sql:
            sql: |
              alter table user_model_permission drop constraint if exists uk_user_model_permission_user_model;
              create unique index if not exists uk_user_model_permission_user_workspace_model
              on user_model_permission(user_id, coalesce(workspace_id, 'GLOBAL'), model_code);
